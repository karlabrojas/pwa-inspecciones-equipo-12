name: e2e

on:
  push:
    branches: [dev, "feat/w08-e2e-regression", "e2e/**"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: npx playwright test

      - name: Subir reporte y artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
